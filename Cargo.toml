[package]
name = "bank-barcode"
version = "0.2.1"
edition = "2021"
rust-version = "1.88"
authors = ["Luukas Pörtfors <lajp@iki.fi>"]
license = "MIT"
description = "Generate Finnish virtual bank barcodes"
repository = "https://github.com/lajp/bank-barcode"
documentation = "https://docs.rs/bank-barcode"
readme = "README.md"
keywords = ["finland", "banking", "barcode", "pankkiviivakoodi"]
categories = ["encoding", "finance"]

[dependencies]
either = "1.15"
iban = "0.2"
thiserror = "2.0"
time = { version = "0.3", features = ["formatting", "macros"] }

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
